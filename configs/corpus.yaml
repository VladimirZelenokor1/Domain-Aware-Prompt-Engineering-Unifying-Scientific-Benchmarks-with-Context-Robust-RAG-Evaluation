# Corpus building configuration
# Domain keywords for article classification, dedup params, source configs.

corpus:
  chunk_size: 256
  chunk_overlap: 64
  tokenizer: cl100k_base
  output_dir: corpus
  seed: 42

sources:
  wikipedia:
    dataset: wikimedia/wikipedia
    config: "20231101.en"
    min_article_words: 200
    output: wikipedia_chunks.jsonl
  pubmed:
    dataset: ccdv/pubmed-summarization
    split: train
    output: pubmed_chunks.jsonl
  openstax:
    dataset: HuggingFaceTB/openstax_paragraphs
    output: openstax_chunks.jsonl

dedup:
  exact: true
  near_duplicate:
    enabled: true
    num_perm: 128
    threshold: 0.9
    shingle_size: 3

