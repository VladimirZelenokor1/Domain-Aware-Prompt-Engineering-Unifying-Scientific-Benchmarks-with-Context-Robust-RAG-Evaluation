# LLM-judge panel configuration (Variant D: automatic-only reliability).
#
# Panel architecture:
#   - Two open-weight judges (judge_a, judge_b) score the first 20 records of
#     every inference cell (run_judge.py --limit-per-file 20). They must be
#     distinct from every examinee model family to preserve judge-examinee
#     independence.
#   - A higher-capacity calibration judge (judge_c) scores a bounded subset of
#     the main set. Used for ECE calibration and Krippendorff's alpha(A, B, C).

main_set_judges:
  - id: judge_a
    model: llama-3.1-8b-judge-awq    # local dir under models/
    role: open_weight_primary
    must_differ_from_examinees: true
    hf_id_candidate: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4  # source used on the server
    fallback_if_oom: qwen2-7b-instruct-awq   # NOT Qwen2.5 (examinee family)
  - id: judge_b
    model: mistral-7b-v0.3-judge-awq  # local dir under models/, distinct from SciPhi-Mistral
    role: open_weight_secondary
    must_differ_from_examinees: true
    hf_id_candidate: solidrust/Mistral-7B-Instruct-v0.3-AWQ

calibration_judge:
  id: judge_c
  # Higher-capacity API calibration judge, independent of every examinee family.
  # Served free via OpenRouter (OpenAI-compatible): export
  #   OPENAI_BASE_URL=https://openrouter.ai/api/v1
  #   OPENAI_API_KEY=<openrouter key>
  # run_judge selects the OpenAI client because the name has no "claude".
  model: openai/gpt-oss-120b:free
  role: proprietary_calibration           # drives the API-engine path (kept for compat)
  # Calibration is measured on the MCQ subset of the evaluated MAIN set (per-judge
  # ECE) and the judged main-set subset (3-way Krippendorff alpha, n~1080) - NOT
  # on dev/holdout. The earlier "dev_set + holdout_audit" was a plan, not the run.
  scope: mcq_subset_of_main_test
  max_items: 1000
  cost_cap_usd: 100                       # ignored for the free model (price 0); guards paid runs
  api:
    rate_limit_rps: 2                     # placeholder
    max_retries: 5
    backoff: exponential
  cache:
    enabled: true
    key: [item_id, judge_model_version, prompt_template_hash]

scoring:
  rubric_scale: [0, 1, 2, 3, 4, 5]        # six-point per thesis Section 3.7.1
  judge_temperature: 0.0
  judge_seed: 42
  metrics:
    - rubric_score                         # 0-5 per criterion
    - faithfulness                         # NLI entailment on decomposed claims
    - citation_precision
    - citation_recall
    - coverage                             # key-point matching
    - self_confidence                      # judge-reported, 0-1

nli:
  model: models/nli-deberta-v3-large    # local dir (avoid HF download)
  label_order: [contradiction, entailment, neutral]

perturbations:
  class_1_surface:                         # typos, whitespace, light paraphrase
    enabled: true
  class_2_semantic:                        # entity swap, negation flip
    enabled: true
  audit_subset_size: 200                   # bounded by calibration budget

prompt_templates:
  dir: configs/judge_prompts                # filled in Phase 7
  hash_algorithm: sha256
