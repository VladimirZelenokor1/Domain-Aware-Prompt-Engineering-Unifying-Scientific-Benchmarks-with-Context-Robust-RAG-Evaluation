experiment: qasper

data:
  track_b:
    sample: data/qasper/sample.json

models:
  llama-3.2-3b:
    path: models/llama-3.2-3b-awq
    quantization: awq
    gpu_memory_utilization: 0.85
    max_model_len: 4096
    enforce_eager: true
    dtype: float16
  qwen2.5-7b:
    path: models/qwen2.5-7b-awq
    quantization: awq
    gpu_memory_utilization: 0.85
    max_model_len: 4096
    enforce_eager: true
    dtype: float16
  sciphi-mistral-7b:
    path: models/sciphi-mistral-7b-awq
    quantization: awq
    gpu_memory_utilization: 0.85
    max_model_len: 4096
    enforce_eager: true
    dtype: float16
    prompt_format: mistral_instruct
  deepseek-r1-qwen-7b:
    path: models/deepseek-r1-qwen-7b-awq
    quantization: awq
    gpu_memory_utilization: 0.85
    max_model_len: 4096
    enforce_eager: true
    dtype: float16
  gemma-2-9b:
    path: models/gemma-2-9b-awq
    quantization: awq_marlin
    gpu_memory_utilization: 0.85
    max_model_len: 4096
    enforce_eager: true
    dtype: float16
  mistral-nemo-12b:
    path: models/mistral-nemo-12b-awq
    quantization: awq
    gpu_memory_utilization: 0.85
    max_model_len: 4096
    enforce_eager: true
    dtype: float16
    prompt_format: mistral_instruct

strategies:
  - da
  - ras
  - ctl
  - sc

retrievers:
  - hybrid

noise:
  config: configs/noise.yaml
  levels: [0.0, 0.6]

inference:
  seed: 42
  max_tokens: 1024
  temperature_greedy: 0.0
  temperature_sc: 0.7
  sc_samples: 5
  sc_min_valid: 3
  top_k_passages: 10
  checkpoint_every: 500

output:
  base_dir: outputs/qasper_main
